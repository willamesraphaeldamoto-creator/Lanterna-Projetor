name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate app icons
        run: |
          npm install --no-save sharp
          node -e "const s=require('sharp'); Promise.all([s('assets/icon.svg').resize(1024,1024).png().toFile('assets/icon.png'),s('assets/icon.svg').resize(432,432).png().toFile('assets/adaptive-icon.png')]).catch(e=>{console.error(e);process.exit(1)})"
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK with bundled JavaScript
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lanterna-Projetor-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error